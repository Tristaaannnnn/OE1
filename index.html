<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Indoor Plant Haven</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><h1>🌿 Indoor Plant Haven</h1><p>Discover easy-care plants and simple tips for a greener room.</p></div><div class="badge" id="countBadge">0 plants</div></header>
<main class="container"><div class="controls"><input id="search" type="search" placeholder="Search plants..."><select id="light"><option value="all">All light levels</option><option value="Low">Low light</option><option value="Medium">Medium light</option><option value="Bright">Bright light</option></select><button id="tipsBtn">Show Care Tip</button></div><section id="plantGrid" class="grid"></section><div class="tips" id="tipBox"><strong>Plant Care Tip:</strong> Choose a plant based on the amount of natural light available in your room.</div></main><div class="footer">Interactive Indoor Plants Webpage • HTML + CSS + JavaScript</div>
<script src="script.js"></script>
</body></html>
